# linux-qcom commit categories
#
# Format:
#   inherit_defaults=yes|no     keep built-in rules after the custom ones
#   alias|FROM:|TO:            rewrite subject prefix FROM -> TO before matching
#   Name|subject|ERE           category for commits whose subject matches ERE
#   Name|body|ERE              category for commits whose (collapsed) body matches ERE

inherit_defaults=yes

# Common subject typos -> canonical tags
alias|FROMLOST:|FROMLIST:
alias|FROMLIT:|FROMLIST:
alias|PEDNING:|PENDING:

# Qualcomm-specific tags
QCLINUX|subject|^QCLINUX:
PENDING|subject|^PENDING:
WORKAROUND|subject|^WORKAROUND:
